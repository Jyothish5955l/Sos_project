# Render.com Blueprint Specification for SOS Guardian
services:
  - type: web
    name: sos-guardian
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
      - key: DATABASE_PATH
        value: /var/data/sos_guardian.db
      - key: PROXY_FIX_FOR
        value: "1"
      - key: PROXY_FIX_PROTO
        value: "1"
      - key: PROXY_FIX_HOST
        value: "1"
      - key: STATIC_CACHE_SECONDS
        value: "86400"
    disk:
      name: sos-guardian-data
      mountPath: /var/data
      sizeGB: 1

