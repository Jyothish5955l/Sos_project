# Render.com Blueprint Specification for SOS Guardian
services:
  - type: web
    name: sos-guardian
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
      - key: DATABASE_PATH
        value: data/sos_guardian.db

